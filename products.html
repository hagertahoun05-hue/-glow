<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowCraft | All Products</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/products.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* تنسيقات إضافية بسيطة خاصة بأزرار التحكم العلوية (الترجمة والدارك مود) لتتوافق مع التصميم الأصلي */
    .nav-icons {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--border-color, #ccc);
      color: inherit;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .custom-translate-wrapper {
      position: relative;
      display: inline-block;
    }
    .custom-translate-btn {
      background: none;
      border: 1px solid var(--border-color, #ccc);
      color: inherit;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }
    .translate-dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 1000;
      min-width: 130px;
    }
    .translate-dropdown-menu.show {
      display: flex;
    }
    .translate-option {
      background: none;
      border: none;
      color: #333;
      padding: 8px 12px;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .translate-option:hover {
      background-color: #f0f0f0;
      color: #374737;
    }
    .goog-te-banner-frame.skiptranslate, #google_translate_element {
      display: none !important;
    }
    body {
      top: 0px !important;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">GlowCraft</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-icons">
      <a href="products.html"><i class="fa-solid fa-magnifying-glass"></i></a>
      <a href="wishlist-compare.html"><i class="fa-regular fa-heart"></i></a>
      <a href="cart.html" class="cart-icon"><i class="fa-solid fa-bag-shopping"></i> <span id="cart-count">0</span></a>
      <a href="profile.html"><i class="fa-regular fa-user"></i></a>

      <!-- زر الترجمة المخصص المتوافق مع الهوم -->
      <div class="custom-translate-wrapper">
        <button id="translateBtn" class="custom-translate-btn" title="Change Language">
          <i class="fa-solid fa-globe"></i>
          <span style="font-size: 12px;">Lang</span>
        </button>
        <div id="translateMenu" class="translate-dropdown-menu">
          <button class="translate-option" onclick="changeLanguage('en')">English</button>
          <button class="translate-option" onclick="changeLanguage('ar')">العربية</button>
        </div>
      </div>

      <!-- زر الدارك مود -->
      <button id="themeToggle" class="theme-toggle-btn">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
    <div id="google_translate_element" style="display:none;"></div>
  </header>

  <!-- Header Banner -->
  <section class="container">
    <div class="products-header-banner">
      <div class="banner-text">
        <h1>Egyptian Skincare Products</h1>
        <p>Explore top Egyptian therapeutic skincare brands for all skin types</p>
      </div>
    </div>
  </section>

  <!-- Main Content Layout -->
  <div class="container products-layout">
    
    <!-- Left Sidebar Filter -->
    <aside class="filters-sidebar">
      <div class="filter-header">
        <h3><i class="fa-solid fa-sliders"></i> Filter</h3>
      </div>
      
      <!-- Skin Type Filter -->
      <div class="filter-group">
        <h4>Skin Type</h4>
        <label><input type="checkbox" value="Oily" class="filter-skin"> Oily</label>
        <label><input type="checkbox" value="Dry" class="filter-skin"> Dry</label>
        <label><input type="checkbox" value="Combination" class="filter-skin"> Combination</label>
        <label><input type="checkbox" value="Sensitive" class="filter-skin"> Sensitive</label>
      </div>

      <!-- Category Filter -->
      <div class="filter-group">
        <h4>Category</h4>
        <label><input type="checkbox" value="Cleansers" class="filter-cat"> Cleansers</label>
        <label><input type="checkbox" value="Serums" class="filter-cat"> Serums</label>
        <label><input type="checkbox" value="Moisturizers" class="filter-cat"> Moisturizers</label>
        <label><input type="checkbox" value="Sunscreens" class="filter-cat"> Sunscreens</label>
        <label><input type="checkbox" value="Masks" class="filter-cat"> Masks</label>
      </div>

      <!-- Price Range Filter (بالجنيه المصري EGP) -->
      <div class="filter-group">
        <h4>Price Range</h4>
        <input type="range" id="price-range" min="30" max="500" value="500">
        <div class="price-labels">
          <span>30 EGP</span>
          <span id="price-val">500 EGP</span>
        </div>
      </div>

      <!-- Sort By Filter -->
      <div class="filter-group">
        <h4>Sort By</h4>
        <select id="sidebar-sort-select" class="custom-select">
          <option value="latest">Latest</option>
          <option value="low-high">Price: Low to High</option>
          <option value="high-low">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </aside>

    <!-- Right Side Products Area -->
    <main class="products-main">
      
      <!-- Top Search Bar -->
      <div class="search-bar-wrap">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-input" placeholder="Search Egyptian therapeutic skincare...">
      </div>

      <!-- Products Grid -->
      <div class="products-grid" id="all-products-grid">
        <p class="loading-state">Loading products...</p>
      </div>

      <!-- Pagination Bar -->
      <div class="pagination-container">
        <div class="pagination-buttons" id="pagination-btns"></div>
        <span class="showing-count" id="showing-text">Loading...</span>
      </div>

    </main>
  </div>

  <!-- سكربتات التحكم (الوضع الداكن والترجمة وقراءة الذاكرة) -->
  <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    const bodyElement = document.body;
    const icon = themeToggleBtn.querySelector('i');

    if (localStorage.getItem('theme') === 'dark') {
      bodyElement.classList.add('dark-mode');
      icon.classList.replace('fa-moon', 'fa-sun');
    }

    themeToggleBtn.addEventListener('click', () => {
      bodyElement.classList.toggle('dark-mode');
      if (bodyElement.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
        icon.classList.replace('fa-moon', 'fa-sun');
      } else {
        localStorage.setItem('theme', 'light');
        icon.classList.replace('fa-sun', 'fa-moon');
      }
    });

    const translateBtn = document.getElementById('translateBtn');
    const translateMenu = document.getElementById('translateMenu');

    translateBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      translateMenu.classList.toggle('show');
    });

    window.addEventListener('click', () => {
      translateMenu.classList.remove('show');
    });

    function changeLanguage(lang) {
      localStorage.setItem('selectedLang', lang);
      document.cookie = `googtrans=/en/${lang};path=/;domain=` + document.domain;
      location.reload();
    }
  </script>

  <!-- Google Translate Engine (لقراءة اللغة المخزنة وتطبيقها فوراً عند الدخول) -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      let storedLang = localStorage.getItem('selectedLang');
      if (storedLang && !document.cookie.includes(`googtrans=/en/${storedLang}`)) {
        document.cookie = `googtrans=/en/${storedLang};path=/;domain=` + document.domain;
      }
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'ar,en',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- ملفات الـ JS الأصلية الخاصة بك -->
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
